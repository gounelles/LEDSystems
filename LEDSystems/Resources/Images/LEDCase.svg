<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Boîtier fermé (coupe)</title>
  <desc>Coupe d'un boîtier plastique fermé : la LED, montée sur un dissipateur, chauffe l'air intérieur et la paroi, qui cèdent la chaleur à l'air extérieur par convection et rayonnement.</desc>
  <!-- Paroi du boîtier (ABS), vue en coupe -->
  <path d="M30 40 H170 V170 H30 Z M38 48 V162 H162 V48 Z" fill="#3a3d42" fill-rule="evenodd"/>
  <!-- Air intérieur -->
  <rect x="38" y="48" width="124" height="114" fill="#eef4fa"/>
  <!-- Dissipateur à ailettes, posé au fond -->
  <g fill="#c9d0d6" stroke="#5c646b" stroke-width="1.5">
    <rect x="66" y="132" width="68" height="12"/>
    <rect x="68" y="144" width="6" height="18"/>
    <rect x="80" y="144" width="6" height="18"/>
    <rect x="92" y="144" width="6" height="18"/>
    <rect x="104" y="144" width="6" height="18"/>
    <rect x="116" y="144" width="6" height="18"/>
    <rect x="126" y="144" width="6" height="18"/>
  </g>
  <!-- LED -->
  <rect x="88" y="124" width="24" height="8" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="100" cy="124" rx="8" ry="3.5" fill="#fff6a8" stroke="#333" stroke-width="1.2"/>
  <!-- Convection de l'air intérieur (boucles) -->
  <g fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linecap="round">
    <path d="M60 128 C48 110 48 80 62 64"/>
    <path d="M140 128 C152 110 152 80 138 64"/>
    <path d="M56 70 L62 64 L64 72"/>
    <path d="M136 72 L138 64 L144 70"/>
  </g>
  <!-- Chaleur cédée à l'extérieur (flèches ondulées) -->
  <g fill="none" stroke="#d9480f" stroke-width="2.5" stroke-linecap="round">
    <!-- vers la gauche -->
    <path d="M26 105 C22 99 18 111 14 105 C10 99 6 111 2 105"/>
    <path d="M8 99 L2 105 L8 111"/>
    <!-- vers la droite -->
    <path d="M174 105 C178 99 182 111 186 105 C190 99 194 111 198 105"/>
    <path d="M192 99 L198 105 L192 111"/>
    <!-- vers le haut, de part et d'autre de la fenêtre -->
    <path d="M55 34 C49 30 61 24 55 20 C49 16 61 10 55 6"/>
    <path d="M49 12 L55 6 L61 12"/>
    <path d="M145 34 C139 30 151 24 145 20 C139 16 151 10 145 6"/>
    <path d="M139 12 L145 6 L151 12"/>
  </g>
  <!-- Lumière émise (à travers une fenêtre) -->
  <rect x="84" y="40" width="32" height="8" fill="#fffbe0" stroke="#3a3d42" stroke-width="1"/>
  <g stroke="#e0a800" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="114" x2="100" y2="58"/>
    <line x1="94" y1="114" x2="86" y2="60"/>
    <line x1="106" y1="114" x2="114" y2="60"/>
  </g>
</svg>
